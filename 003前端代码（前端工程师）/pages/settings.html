<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>设置 · Petal Ledger</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../shared/css/tailwind.config.js"></script>
    <link rel="stylesheet" href="../shared/css/tokens.css" />
    <link rel="stylesheet" href="../shared/css/base.css" />
    <style>
        .bg-pattern {
            background-image: radial-gradient(var(--border-blush) 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="bg-background bg-pattern text-on-surface font-body-lg antialiased flex flex-col min-h-[100dvh] overflow-x-hidden">

    <!-- 顶部应用栏 -->
    <header class="flex justify-between items-center h-14 px-container-padding w-full z-50 bg-surface/80 backdrop-blur-md border-b border-border-blush sticky top-0 relative">
        <a href="home.html" class="flex items-center gap-1.5 px-3.5 py-2 rounded-full text-primary hover:bg-bg-soft-pink transition-all active:scale-95">
            <span class="material-symbols-outlined text-[22px]">arrow_back</span>
            <span class="font-body-lg text-[18px] font-semibold leading-none">首页</span>
        </a>
        <h1 class="font-headline-md text-headline-md font-bold text-primary absolute left-1/2 -translate-x-1/2 pointer-events-none">设置</h1>
        <button aria-label="更多" class="text-primary hover:bg-bg-soft-pink transition-colors p-2 rounded-full active:scale-95 flex items-center justify-center w-10 h-10">
            <span class="material-symbols-outlined">more_vert</span>
        </button>
    </header>

    <!-- 主内容 -->
    <main class="flex-1 px-container-padding pt-6 pb-[90px] space-y-section-margin">

        <!-- 个人资料 -->
        <section class="relative bg-surface-white rounded-xl border border-border-blush p-5 shadow-[0_4px_12px_rgba(255,107,157,0.05)] overflow-hidden">
            <div class="absolute -right-8 -top-8 w-32 h-32 bg-primary-fixed-dim/30 rounded-full blur-2xl"></div>
            <div class="flex items-center gap-4 relative z-10">
                <div class="relative w-16 h-16 rounded-full p-1 bg-gradient-to-tr from-expense-red to-tertiary-fixed">
                    <img id="user-avatar" class="w-full h-full rounded-full border-2 border-surface-white object-cover shadow-sm bg-surface-container" alt="头像" />
                </div>
                <div class="flex-1">
                    <h2 id="user-nickname" class="font-headline-md text-headline-md text-on-surface mb-1">Petal User</h2>
                    <div class="inline-flex items-center gap-1 bg-tertiary-fixed text-on-tertiary-fixed px-2 py-0.5 rounded-full">
                        <span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">workspace_premium</span>
                        <span class="font-label-caps text-label-caps">Premium Member</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 账号 -->
        <section>
            <h3 class="font-label-caps text-label-caps text-text-muted mb-2 px-1">账号</h3>
            <div class="bg-surface-white rounded-xl border border-border-blush overflow-hidden shadow-[0_2px_8px_rgba(255,107,157,0.02)]">
                <div class="flex items-center justify-between p-4 border-b border-border-blush">
                    <span class="font-body-lg text-body-lg text-on-surface">当前用户</span>
                    <span id="current-username" class="font-body-sm text-body-sm text-text-muted">--</span>
                </div>
                <button id="btn-logout" class="w-full flex items-center justify-between p-4 hover:bg-surface-container-low transition-colors text-error active:bg-error-container">
                    <span class="font-body-lg text-body-lg">退出登录</span>
                    <span class="material-symbols-outlined">logout</span>
                </button>
            </div>
        </section>

    </main>

    <!-- 底部导航 -->
    <div id="bottom-nav" data-active="settings"></div>

    <script src="../shared/js/auth.js"></script>
    <script src="../shared/js/utils.js"></script>
    <script src="../shared/js/data.js"></script>
    <script src="../shared/js/nav.js"></script>

    <script>
        if (!Auth.requireAuth()) {} else { init(); }

        function init() {
            // 渲染用户信息
            const session = Auth.getSession();
            const user = MockData.currentUser;
            document.getElementById('user-avatar').src = user.avatar;
            document.getElementById('user-nickname').textContent = user.nickname;
            document.getElementById('current-username').textContent = session ? session.username : user.username;

            // 退出登录（二次确认）
            document.getElementById('btn-logout').addEventListener('click', () => {
                if (confirm('确定要退出登录吗？\n（本地数据不会丢失）')) {
                    Auth.logout();
                    window.location.href = 'login.html';
                }
            });

            BottomNav.init();
        }
    </script>
</body>
</html>
