<body class="bg-bg-soft-pink min-h-screen text-on-surface font-body-lg">
<!-- Main Content Container -->
<div class="pb-[90px] relative w-full md:max-w-md mx-auto md:bg-surface md:shadow-2xl md:min-h-screen">
<!-- Header -->
<header class="px-container-padding pt-6 pb-4 flex justify-between items-center sticky top-0 z-40 bg-bg-soft-pink/90 md:bg-surface/90 backdrop-blur-md">
<h1 class="font-headline-lg text-headline-lg text-on-surface">统计 - 随手记账</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors text-primary">
<span class="material-symbols-outlined" data-icon="file_download">file_download</span>
</button>
</header>
<!-- Time Filter -->
<div class="px-container-padding mb-section-margin">
<div class="flex bg-surface rounded-full p-1 border border-border-blush relative shadow-sm">
<div class="absolute left-1/3 top-1 bottom-1 w-[calc(33.33%-4px)] bg-primary-container rounded-full shadow-sm z-0"></div>
<button class="flex-1 text-center py-2 z-10 font-label-caps text-label-caps text-text-muted">周</button>
<button class="flex-1 text-center py-2 z-10 font-label-caps text-label-caps text-on-primary-container font-bold">月</button>
<button class="flex-1 text-center py-2 z-10 font-label-caps text-label-caps text-text-muted">年</button>
</div>
</div>
<!-- Summary Cards -->
<div class="px-container-padding grid grid-cols-2 gap-card-gap mb-section-margin">
<!-- Expense -->
<div class="bg-surface rounded-xl p-4 border border-border-blush shadow-[0_4px_12px_rgba(255,107,157,0.05)]">
<div class="flex items-center gap-2 mb-2">
<div class="w-8 h-8 rounded-full bg-expense-red/15 flex items-center justify-center">
<span class="material-symbols-outlined text-expense-red text-[18px]" data-icon="trending_down" style="font-variation-settings: 'FILL' 1;">trending_down</span>
</div>
<span class="font-body-sm text-body-sm text-text-muted">总支出</span>
</div>
<div class="font-display-amount text-display-amount text-on-surface text-[24px] leading-8">¥4,250.00</div>
<div class="font-error-text text-error-text text-expense-red flex items-center mt-1">
<span class="material-symbols-outlined text-[14px]" data-icon="arrow_upward">arrow_upward</span> 12% 较上月
                </div>
</div>
<!-- Income -->
<div class="bg-surface rounded-xl p-4 border border-border-blush shadow-[0_4px_12px_rgba(255,107,157,0.05)]">
<div class="flex items-center gap-2 mb-2">
<div class="w-8 h-8 rounded-full bg-income-teal/15 flex items-center justify-center">
<span class="material-symbols-outlined text-income-teal text-[18px]" data-icon="trending_up" style="font-variation-settings: 'FILL' 1;">trending_up</span>
</div>
<span class="font-body-sm text-body-sm text-text-muted">总收入</span>
</div>
<div class="font-display-amount text-display-amount text-on-surface text-[24px] leading-8">¥8,500.00</div>
<div class="font-error-text text-error-text text-income-teal flex items-center mt-1">
<span class="material-symbols-outlined text-[14px]" data-icon="arrow_upward">arrow_upward</span> 5% 较上月
                </div>
</div>
</div>
<!-- Chart Area -->
<div class="px-container-padding mb-section-margin">
<div class="bg-surface rounded-xl p-5 border border-border-blush shadow-[0_4px_12px_rgba(255,107,157,0.05)] relative overflow-hidden">
<div class="flex justify-between items-center mb-6">
<h2 class="font-headline-md text-headline-md text-on-surface">收支趋势</h2>
<div class="flex gap-3">
<div class="flex items-center gap-1 font-error-text text-error-text text-text-muted">
<div class="w-2 h-2 rounded-full bg-expense-red"></div>支出
                        </div>
<div class="flex items-center gap-1 font-error-text text-error-text text-text-muted">
<div class="w-2 h-2 rounded-full bg-income-teal"></div>收入
                        </div>
</div>
</div>
<!-- Stylized SVG Line Chart -->
<svg class="w-full h-40 overflow-visible" viewbox="0 0 400 180">
<!-- Grid Lines -->
<line stroke="#FFE0E6" stroke-dasharray="4 4" stroke-width="1" x1="0" x2="400" y1="45" y2="45"></line>
<line stroke="#FFE0E6" stroke-dasharray="4 4" stroke-width="1" x1="0" x2="400" y1="90" y2="90"></line>
<line stroke="#FFE0E6" stroke-dasharray="4 4" stroke-width="1" x1="0" x2="400" y1="135" y2="135"></line>
<!-- Income Line (Teal) -->
<path d="M0 120 C 50 90, 100 110, 150 70 C 200 100, 250 50, 300 40 C 350 30, 400 80, 400 80" fill="none" stroke="#7EDDD3" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"></path>
<path d="M0 120 C 50 90, 100 110, 150 70 C 200 100, 250 50, 300 40 C 350 30, 400 80, 400 80 L 400 180 L 0 180 Z" fill="url(#incomeGradient)" opacity="0.4"></path>
<!-- Expense Line (Red) -->
<path d="M0 150 C 50 140, 100 160, 150 120 C 200 80, 250 130, 300 110 C 350 100, 400 140, 400 140" fill="none" stroke="#FF6B9D" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"></path>
<path d="M0 150 C 50 140, 100 160, 150 120 C 200 80, 250 130, 300 110 C 350 100, 400 140, 400 140 L 400 180 L 0 180 Z" fill="url(#expenseGradient)" opacity="0.4"></path>
<defs>
<lineargradient id="incomeGradient" x1="0%" x2="0%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#7EDDD3"></stop>
<stop offset="100%" stop-color="#7EDDD3" stop-opacity="0"></stop>
</lineargradient>
<lineargradient id="expenseGradient" x1="0%" x2="0%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#FF6B9D"></stop>
<stop offset="100%" stop-color="#FF6B9D" stop-opacity="0"></stop>
</lineargradient>
</defs>
</svg>
<div class="flex justify-between mt-4 font-error-text text-error-text text-text-disabled">
<span>1日</span><span>8日</span><span>15日</span><span>22日</span><span>30日</span>
</div>
</div>

<div>

</div>
</div>
<div class="font-headline-md text-headline-md text-on-surface text-[18px]">¥1,912.50</div>
</div>
<div class="h-2 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-[#FF9F43] rounded-full" style="width: 45%;"></div>
</div>
</div>
<!-- Category Item 2 -->
<div>
<div class="flex justify-between items-center mb-2">
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-full bg-[#FF6B9D]/15 flex items-center justify-center text-[24px]">🛍️</div>
<div>
<div class="font-body-lg text-body-lg text-on-surface font-semibold">购物消费</div>

</div>
</div>
<div class="font-headline-md text-headline-md text-on-surface text-[18px]">¥1,062.50</div>
</div>
<div class="h-2 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-[#FF6B9D] rounded-full" style="width: 25%;"></div>
</div>
</div>
<!-- Category Item 3 -->
<div>
<div class="flex justify-between items-center mb-2">

</div>
</div>
<div class="font-headline-md text-headline-md text-on-surface text-[18px]">¥637.50</div>
</div>
<div class="h-2 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-[#54A0FF] rounded-full" style="width: 15%;"></div>
</div>
</div>
</div>
<button class="w-full mt-4 py-3 bg-surface border border-border-blush text-primary rounded-xl font-body-sm text-body-sm font-semibold hover:bg-bg-soft-pink transition-colors">
