<body class="bg-bg-soft-pink text-on-surface font-body-sm min-h-screen flex items-center justify-center p-container-padding">
<div class="w-full max-w-md bg-surface-white rounded-[24px] shadow-[0_8px_32px_rgba(255,107,157,0.1)] p-8 md:p-10 border border-border-blush relative overflow-hidden">
<!-- Decorative subtle shapes -->
<div class="absolute -top-16 -right-16 w-32 h-32 bg-primary-fixed rounded-full blur-2xl opacity-60 pointer-events-none"></div>
<div class="absolute -bottom-16 -left-16 w-40 h-40 bg-secondary-fixed rounded-full blur-3xl opacity-40 pointer-events-none"></div>
<!-- Header -->
<div class="flex flex-col items-center mb-8 relative z-10">
<div class="w-24 h-24 mb-4 rounded-2xl overflow-hidden shadow-[0_4px_12px_rgba(255,107,157,0.15)] border-2 border-surface-white">
<img alt="Petal Ledger Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AP1WRLtpDWmukh7rT_GarF4hxofXCrkGRWpzqs11mxJ-fXv1kgYx45ncOLeTw9LwGSmJQUWxmKaBIKxfJXQFtQtKuoIt6yRp-lGtSeer5xE3JgOgXxgted9YB27-cc1wbqWHOtloxjCGQSiwqV5KoAFMBXoFHYK3Bnh69vKCgxociw1I3uUm7Kh809YlRfRaOLZGEk4Eqk4TEvBHv3DQwe3PlQZFR5nHzq5pCawFNQtITScvWeQ358e-CDxYeJQa"/>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary mb-2 text-center">Petal Ledger</h1>
<p class="font-body-sm text-body-sm text-text-muted text-center">加入 Petal Ledger, 记录每一笔花开</p>
</div>
<!-- Form -->
<form class="space-y-5 relative z-10" onsubmit="event.preventDefault();">
<!-- Username Input -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-text-disabled">
<span class="material-symbols-outlined text-[20px]" data-icon="person">person</span>
</div>
<input class="w-full pl-11 pr-4 py-3.5 bg-surface-white border border-border-blush rounded-xl font-body-lg text-body-lg text-on-surface placeholder-text-disabled focus:ring-0 focus:border-2 focus:border-expense-red transition-all duration-200 outline-none" id="username" placeholder="请输入3-20位用户名" type="text"/>
</div>
<!-- Password Input -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-text-disabled">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input class="w-full pl-11 pr-11 py-3.5 bg-surface-white border border-border-blush rounded-xl font-body-lg text-body-lg text-on-surface placeholder-text-disabled focus:ring-0 focus:border-2 focus:border-expense-red transition-all duration-200 outline-none" id="password" placeholder="请输入密码" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-text-disabled hover:text-expense-red transition-colors" onclick="togglePassword('password', 'eyeIcon1')" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility" id="eyeIcon1">visibility</span>
</button>
</div>
<!-- Confirm Password Input -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-text-disabled">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input class="w-full pl-11 pr-11 py-3.5 bg-surface-white border border-border-blush rounded-xl font-body-lg text-body-lg text-on-surface placeholder-text-disabled focus:ring-0 focus:border-2 focus:border-expense-red transition-all duration-200 outline-none" id="confirm_password" placeholder="请再次输入密码" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-text-disabled hover:text-expense-red transition-colors" onclick="togglePassword('confirm_password', 'eyeIcon2')" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility" id="eyeIcon2">visibility</span>
</button>
</div>
<!-- Action Button -->
<button class="w-full bg-primary-gradient text-surface-white font-headline-md text-headline-md py-4 rounded-xl shadow-[0_4px_12px_rgba(255,107,157,0.3)] hover:shadow-[0_6px_16px_rgba(255,107,157,0.4)] active:scale-[0.98] transition-all duration-200 mt-6" type="submit">
                立即注册
            </button>
</form>
<!-- Footer Link -->
<div class="mt-8 text-center relative z-10">
<a class="font-body-sm text-body-sm text-expense-red hover:text-primary transition-colors inline-flex items-center gap-1 group" href="#">
                已有账号？立即登录
                <span class="material-symbols-outlined text-[16px] group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</a>
</div>
</div>
<script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
                icon.setAttribute('data-icon', 'visibility_off');
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
                icon.setAttribute('data-icon', 'visibility');
            }
        }
    </script>
