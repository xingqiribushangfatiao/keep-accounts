<script>
        // Simple Segemented Control Logic
        const btnExpense = document.getElementById('btn-expense');
        const btnIncome = document.getElementById('btn-income');
        const highlighter = document.getElementById('segment-highlighter');
        let isExpense = true;

        btnExpense.addEventListener('click', () => {
            if (!isExpense) {
                isExpense = true;
                highlighter.style.transform = 'translateX(0)';
                btnExpense.classList.add('text-expense-red', 'font-bold');
                btnExpense.classList.remove('text-text-muted');
                btnIncome.classList.remove('text-income-teal', 'font-bold');
                btnIncome.classList.add('text-text-muted');
            }
        });

        btnIncome.addEventListener('click', () => {
            if (isExpense) {
                isExpense = false;
                highlighter.style.transform = 'translateX(100%)';
                btnIncome.classList.add('text-income-teal', 'font-bold');
                btnIncome.classList.remove('text-text-muted');
                btnExpense.classList.remove('text-expense-red', 'font-bold');
                btnExpense.classList.add('text-text-muted');
            }
        });

        // Keypad Logic
        let currentAmount = "0.00";
        let inputString = "";
        const amountDisplay = document.getElementById('amount-display');

        function updateDisplay() {
            if (inputString === "") {
                amountDisplay.textContent = "0.00";
            } else {
                amountDisplay.textContent = inputString;
            }
        }

        function appendNumber(num) {
            if (inputString === "0" && num !== ".") {
                 inputString = num;
            } else if (num === "." && inputString.includes(".")) {
                return; // Prevent multiple decimals
            } else if (inputString.includes(".") && inputString.split(".")[1].length >= 2) {
                return; // limit to 2 decimal places
            }
             else {
                inputString += num;
            }
            updateDisplay();
        }

        function deleteNumber() {
            if (inputString.length > 0) {
                inputString = inputString.slice(0, -1);
            }
            updateDisplay();
        }

        function clearNumber() {
            inputString = "";
            updateDisplay();
        }
        
        function saveRecord() {
            // Animation feedback could go here
            console.log("Saving record:", inputString);
        }
    </script>
