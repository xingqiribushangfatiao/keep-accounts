<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>统计 · Petal Ledger</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../shared/css/tailwind.config.js"></script>
    <link rel="stylesheet" href="../shared/css/tokens.css" />
    <link rel="stylesheet" href="../shared/css/base.css" />
</head>
<body class="bg-bg-soft-pink min-h-screen text-on-surface font-body-lg pb-[90px]">

    <!-- 顶部应用栏 -->
    <header class="px-container-padding pt-6 pb-4 flex justify-between items-center sticky top-0 z-40 bg-bg-soft-pink/90 backdrop-blur-md relative">
        <a href="home.html" class="flex items-center gap-1.5 px-3.5 py-2 rounded-full text-primary bg-surface-white/70 hover:bg-surface-white shadow-sm hover:shadow transition-all active:scale-95">
            <span class="material-symbols-outlined text-[22px]">arrow_back</span>
            <span class="font-body-lg text-[18px] font-semibold leading-none">首页</span>
        </a>
        <h1 class="font-headline-md text-headline-md text-on-surface absolute left-1/2 -translate-x-1/2 pointer-events-none">统计</h1>
        <button aria-label="导出" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors text-primary">
            <span class="material-symbols-outlined">file_download</span>
        </button>
    </header>

    <!-- 时间筛选 -->
    <div class="px-container-padding mb-section-margin">
        <div class="flex bg-surface rounded-full p-1 border border-border-blush relative shadow-sm">
            <div id="time-highlighter" class="absolute top-1 bottom-1 w-[calc(33.33%-4px)] bg-primary-container rounded-full shadow-sm z-0"
                 style="left: calc(33.33% + 2px);"></div>
            <button data-range="week" class="time-btn flex-1 text-center py-2 z-10 font-label-caps text-label-caps text-text-muted">周</button>
            <button data-range="month" class="time-btn flex-1 text-center py-2 z-10 font-label-caps text-label-caps text-on-primary-container font-bold">月</button>
            <button data-range="year" class="time-btn flex-1 text-center py-2 z-10 font-label-caps text-label-caps text-text-muted">年</button>
        </div>
    </div>

    <!-- 汇总卡片 -->
    <div class="px-container-padding grid grid-cols-2 gap-card-gap mb-section-margin">
        <div class="bg-surface rounded-xl p-4 border border-border-blush shadow-[0_4px_12px_rgba(255,107,157,0.05)]">
            <div class="flex items-center gap-2 mb-2">
                <div class="w-8 h-8 rounded-full bg-expense-red/15 flex items-center justify-center">
                    <span class="material-symbols-outlined text-expense-red text-[18px]" style="font-variation-settings: 'FILL' 1;">trending_down</span>
                </div>
                <span class="font-body-sm text-body-sm text-text-muted">总支出</span>
            </div>
            <div id="total-expense" class="font-display-amount text-on-surface text-[24px] leading-8">¥ 0.00</div>
            <div class="font-error-text text-error-text text-expense-red flex items-center mt-1">
                <span id="expense-arrow" class="material-symbols-outlined text-[14px]">arrow_upward</span>
                <span id="expense-compare" class="ml-1">0% 较上月</span>
            </div>
        </div>
        <div class="bg-surface rounded-xl p-4 border border-border-blush shadow-[0_4px_12px_rgba(255,107,157,0.05)]">
            <div class="flex items-center gap-2 mb-2">
                <div class="w-8 h-8 rounded-full bg-income-teal/15 flex items-center justify-center">
                    <span class="material-symbols-outlined text-income-teal text-[18px]" style="font-variation-settings: 'FILL' 1;">trending_up</span>
                </div>
                <span class="font-body-sm text-body-sm text-text-muted">总收入</span>
            </div>
            <div id="total-income" class="font-display-amount text-on-surface text-[24px] leading-8">¥ 0.00</div>
            <div class="font-error-text text-error-text text-income-teal flex items-center mt-1">
                <span id="income-arrow" class="material-symbols-outlined text-[14px]">arrow_upward</span>
                <span id="income-compare" class="ml-1">0% 较上月</span>
            </div>
        </div>
    </div>

    <!-- 图表区域 -->
    <div class="px-container-padding mb-section-margin">
        <div class="bg-surface rounded-xl p-5 border border-border-blush shadow-[0_4px_12px_rgba(255,107,157,0.05)] relative overflow-hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="font-headline-md text-headline-md text-on-surface">收支趋势</h2>
                <div class="flex gap-3">
                    <div class="flex items-center gap-1 font-error-text text-error-text text-text-muted">
                        <div class="w-2 h-2 rounded-full bg-expense-red"></div>支出
                    </div>
                    <div class="flex items-center gap-1 font-error-text text-error-text text-text-muted">
                        <div class="w-2 h-2 rounded-full bg-income-teal"></div>收入
                    </div>
                </div>
            </div>
            <div id="trend-chart" class="w-full h-48 relative">
                <!-- 折线图容器（5 个时间点 × 2 条线：收入 / 支出），由 JS 动态渲染 -->
            </div>
        </div>
    </div>

    <!-- 底部导航 -->
    <nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-16 bg-surface/90 backdrop-blur-lg px-2 pb-safe z-50 rounded-t-xl border-t border-border-blush"
         style="box-shadow: var(--shadow-bottom-nav);">
        <a href="home.html" class="flex flex-col items-center justify-center px-4 py-1 transition-colors flex-1 text-text-muted hover:text-primary">
            <span class="material-symbols-outlined">home</span>
            <span class="font-label-caps text-label-caps mt-1">首页</span>
        </a>
        <a href="list.html" class="flex flex-col items-center justify-center px-4 py-1 transition-colors flex-1 text-text-muted hover:text-primary">
            <span class="material-symbols-outlined">receipt_long</span>
            <span class="font-label-caps text-label-caps mt-1">明细</span>
        </a>
        <a href="stats.html" class="flex flex-col items-center justify-center px-4 py-1 transition-colors flex-1 text-primary font-bold bg-primary-container/20 rounded-xl scale-90">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">leaderboard</span>
            <span class="font-label-caps text-label-caps mt-1">统计</span>
        </a>
        <a href="settings.html" class="flex flex-col items-center justify-center px-4 py-1 transition-colors flex-1 text-text-muted hover:text-primary">
            <span class="material-symbols-outlined">settings</span>
            <span class="font-label-caps text-label-caps mt-1">设置</span>
        </a>
    </nav>

    <script src="../shared/js/auth.js"></script>
    <script src="../shared/js/utils.js"></script>
    <script src="../shared/js/data.js"></script>
    <script src="../shared/js/nav.js"></script>

    <script>
        if (!Auth.requireAuth()) {} else { init(); }

        /* ========== 时间范围 → 较 X 期 文案 ========== */
        const COMPARE_LABELS = {
            week:  '较上周',
            month: '较上月',
            year:  '较上年',
        };

        /**
         * 取当前/上期的时间范围（本地零点 Date）
         *  - week  : 本周一 ~ 本周日；上一周同样区间
         *  - month : 本月 1 日 ~ 本月最后一天；上月同样区间
         *  - year  : 本年 1/1 ~ 12/31；去年同样区间
         */
        function getPeriodRange(range) {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            let cs, ce, ps, pe;

            if (range === 'week') {
                const dow = today.getDay();              // 0=Sun .. 6=Sat
                const monOffset = dow === 0 ? -6 : 1 - dow;
                cs = new Date(today); cs.setDate(today.getDate() + monOffset);
                ce = new Date(cs);     ce.setDate(cs.getDate() + 6);
                ps = new Date(cs);     ps.setDate(cs.getDate() - 7);
                pe = new Date(cs);     pe.setDate(cs.getDate() - 1);
            } else if (range === 'month') {
                cs = new Date(today.getFullYear(), today.getMonth(), 1);
                ce = new Date(today.getFullYear(), today.getMonth() + 1, 0);
                ps = new Date(today.getFullYear(), today.getMonth() - 1, 1);
                pe = new Date(today.getFullYear(), today.getMonth(), 0);
            } else { // year
                cs = new Date(today.getFullYear(), 0, 1);
                ce = new Date(today.getFullYear(), 11, 31);
                ps = new Date(today.getFullYear() - 1, 0, 1);
                pe = new Date(today.getFullYear() - 1, 11, 31);
            }
            return { currentStart: cs, currentEnd: ce, prevStart: ps, prevEnd: pe };
        }

        /** 把 YYYY-MM-DD 解析成本地零点（避免 UTC 偏移少一天） */
        function parseLocalDate(str) {
            const [y, m, d] = str.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        /** 指定区间内、某类型的总额 */
        function sumInRange(start, end, type) {
            return MockData.transactions
                .filter((t) => t.type === type)
                .filter((t) => {
                    const d = parseLocalDate(t.date);
                    return d >= start && d <= end;
                })
                .reduce((s, t) => s + t.amount, 0);
        }

        /** 变化百分比（取整）；处理上期为 0 的边界 */
        function calcChange(current, previous) {
            if (previous === 0) return current === 0 ? 0 : 100;
            return Math.round(((current - previous) / previous) * 100);
        }

        /** 更新某个类型的"较 X 期"小标签：箭头 + 百分比 + 文案 */
        function updateCompareUI(type, change, label) {
            const arrow = document.getElementById(`${type}-arrow`);
            const text  = document.getElementById(`${type}-compare`);
            let icon, txt;
            if (change > 0) { icon = 'arrow_upward';   txt = `+${change}% ${label}`; }
            else if (change < 0) { icon = 'arrow_downward'; txt = `${change}% ${label}`; }
            else { icon = 'remove'; txt = `0% ${label}`; }
            arrow.textContent = icon;
            text.textContent = txt;
        }

        /** 渲染汇总：总额 + 较 X 期 */
        function updateSummary(range) {
            const { currentStart, currentEnd, prevStart, prevEnd } = getPeriodRange(range);
            const curExp = sumInRange(currentStart, currentEnd, 'expense');
            const curInc = sumInRange(currentStart, currentEnd, 'income');
            const preExp = sumInRange(prevStart, prevEnd, 'expense');
            const preInc = sumInRange(prevStart, prevEnd, 'income');
            const label = COMPARE_LABELS[range];

            document.getElementById('total-expense').textContent = Utils.formatCurrency(curExp);
            document.getElementById('total-income').textContent  = Utils.formatCurrency(curInc);
            updateCompareUI('expense', calcChange(curExp, preExp), label);
            updateCompareUI('income',  calcChange(curInc, preInc), label);
        }

        /* ============================================================
         * 收支趋势折线图
         * - 周：本周 + 前 4 周（5 个点），X 轴：本周 / 上周 / ...
         * - 月：当前月内 5 周（按月内周维度统计），X 轴：第1周 ~ 第5周
         * - 年：当前年 1-5 月（按月份维度统计），X 轴：1月 ~ 5月
         * 每个点 = 当期内的支出 / 收入总额（单位：元）
         * ============================================================ */
        const WEEK_LABELS  = ['本周', '上周', '上上周', '上上上周', '上上上上周'];
        const MONTH_LABELS = ['第1周', '第2周', '第3周', '第4周', '第5周'];
        const YEAR_LABELS  = ['1月', '2月', '3月', '4月', '5月'];

        // 兜底演示数据：保证 5 个点都有非 0 数值（真实 MockData 为 0 时使用，让折线有起伏）
        // 格式：[expense, income]，按 X 轴顺序（最新 → 最旧 或 第1周 → 第5周）
        const SEED = {
            week:  [[450, 0], [1200, 500], [850, 0], [2100, 0], [650, 8500]],
            month: [[850, 0], [1500, 8500], [950, 0], [1200, 0], [400, 0]],
            year:  [[4500, 8500], [5200, 9000], [4800, 8500], [5500, 9000], [4917, 9000]],
        };

        function getTrendData(range) {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const periods = [];

            if (range === 'week') {
                const dow = today.getDay();              // 0=Sun .. 6=Sat
                const monOffset = dow === 0 ? -6 : 1 - dow;
                const thisMon = new Date(today);
                thisMon.setDate(today.getDate() + monOffset);

                for (let i = 4; i >= 0; i--) {
                    const start = new Date(thisMon);
                    start.setDate(thisMon.getDate() - i * 7);
                    const end = new Date(start);
                    end.setDate(start.getDate() + 6);
                    end.setHours(23, 59, 59, 999);
                    periods.push({
                        label: WEEK_LABELS[i],
                        expense: sumInRange(start, end, 'expense'),
                        income:  sumInRange(start, end, 'income'),
                    });
                }
            } else if (range === 'month') {
                // 当前月：1-7 / 8-14 / 15-21 / 22-28 / 29-月末
                const year = today.getFullYear();
                const month = today.getMonth();
                const monthEnd = new Date(year, month + 1, 0).getDate();
                for (let w = 0; w < 5; w++) {
                    const startDay = 1 + w * 7;
                    const endDay = Math.min(startDay + 6, monthEnd);
                    // 月份没有第 5 周时（如非闰年的 2 月），塞一个 0 区间占位
                    if (startDay > monthEnd) {
                        periods.push({ label: MONTH_LABELS[w], expense: 0, income: 0 });
                        continue;
                    }
                    const start = new Date(year, month, startDay);
                    const end = new Date(year, month, endDay);
                    end.setHours(23, 59, 59, 999);
                    periods.push({
                        label: MONTH_LABELS[w],
                        expense: sumInRange(start, end, 'expense'),
                        income:  sumInRange(start, end, 'income'),
                    });
                }
            } else { // year
                // 当前年：1月 / 2月 / 3月 / 4月 / 5月
                const year = today.getFullYear();
                for (let m = 0; m < 5; m++) {
                    const start = new Date(year, m, 1);
                    const end = new Date(year, m + 1, 0);
                    end.setHours(23, 59, 59, 999);
                    periods.push({
                        label: YEAR_LABELS[m],
                        expense: sumInRange(start, end, 'expense'),
                        income:  sumInRange(start, end, 'income'),
                    });
                }
            }
            return periods;
        }

        /** 把数据值与 seed 兜底合并：真实数据优先，全 0 时用 seed */
        function withSeed(periods, range) {
            const seeds = SEED[range] || [];
            return periods.map((p, i) => {
                const s = seeds[i] || [0, 0];
                return {
                    ...p,
                    expense: p.expense > 0 ? p.expense : s[0],
                    income:  p.income  > 0 ? p.income  : s[1],
                };
            });
        }

        /** 折线图节点数值：完整金额（单位：元），不做 k 缩写 */
        function fmtTrendVal(v) {
            return Math.round(v).toString();
        }

        function renderTrendChart(range) {
            const host = document.getElementById('trend-chart');
            if (!host) return;

            // 销毁旧图表实例（清空容器 DOM，避免重叠/报错）
            host.innerHTML = '';

            const periods = withSeed(getTrendData(range), range);
            const expData = periods.map((p) => p.expense);
            const incData = periods.map((p) => p.income);

            // 空状态：所有点都是 0
            const totalAll = expData.reduce((a, b) => a + b, 0) + incData.reduce((a, b) => a + b, 0);
            if (totalAll === 0) {
                host.innerHTML = '<div class="absolute inset-0 flex items-center justify-center text-text-muted font-body-sm text-body-sm">暂无收支趋势数据</div>';
                return;
            }

            const maxV = Math.max(...expData, ...incData, 1);

            // 画布与留白
            const W = 400, H = 180;
            const padL = 18, padR = 18, padT = 24, padB = 28;
            const chartW = W - padL - padR;
            const chartH = H - padT - padB;

            // 5 个数据点等分
            const toPoints = (data) => data.map((v, i) => ({
                x: padL + (chartW / 4) * i,
                y: padT + chartH - (v / maxV) * chartH,
                v,
            }));
            const expP = toPoints(expData);
            const incP = toPoints(incData);

            const linePath = (pts) => pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x + ',' + p.y).join(' ');
            const areaPath = (pts) => {
                const line = linePath(pts);
                const last  = pts[pts.length - 1];
                const first = pts[0];
                return line + ` L${last.x},${padT + chartH} L${first.x},${padT + chartH} Z`;
            };

            // 网格（3 条虚线）
            const gridYs = [0.25, 0.5, 0.75].map((r) => padT + chartH * r);
            const gridLines = gridYs.map((y) =>
                `<line stroke="#FFE0E6" stroke-dasharray="4 4" stroke-width="1" x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}" />`
            ).join('');

            // 颜色：支出=主题粉，收入=绿色
            const expColor = '#FF6B9D';
            const incColor = '#10AC84';

            // 数据点圆 + 数值标签 + hover tooltip（<title> 触发浏览器原生提示框）
            // - 收入标签固定在点上方，支出标签固定在点下方，两行错开避免互相覆盖
            // - 点贴近底部时（flipUp）翻到点的对侧
            // - paint-order="stroke" 让白色描边先画、字色后画，形成光晕
            const dot = (p, color, tip) => p.v > 0
                ? `<g><circle cx="${p.x}" cy="${p.y}" r="4.5" fill="${color}" stroke="#fff" stroke-width="2" /><title>${tip}</title></g>`
                : `<g><circle cx="${p.x}" cy="${p.y}" r="2" fill="${color}" opacity="0.4" /></g>`;
            const label = (p, color, above) => p.v > 0
                ? `<text x="${p.x}" y="${above ? p.y - 9 : p.y + 16}" text-anchor="middle" font-size="9" font-weight="700" fill="${color}" stroke="#fff" stroke-width="2.5" paint-order="stroke">${fmtTrendVal(p.v)}</text>`
                : '';

            const flipUp = (p) => p.y > (H - 36);
            const expCircles = expP.map((p) => dot(p, expColor, `${p.label} · 支出 ¥${fmtTrendVal(p.v)}`)).join('');
            const incCircles = incP.map((p) => dot(p, incColor, `${p.label} · 收入 ¥${fmtTrendVal(p.v)}`)).join('');
            const expLabels  = expP.map((p) => label(p, expColor, flipUp(p))).join('');  // 支出：默认下方
            const incLabels  = incP.map((p) => label(p, incColor, true)).join('');         // 收入：固定上方

            // X 轴标签
            const xLabels = periods.map((p, i) => {
                const x = padL + (chartW / 4) * i;
                return `<text x="${x}" y="${H - 10}" text-anchor="middle" font-size="10" fill="#9aa0a6">${p.label}</text>`;
            }).join('');

            // 全部塞进一张 SVG
            const svg = `
                <svg class="block w-full h-full" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
                    ${gridLines}

                    <!-- 支出：面积 + 折线 -->
                    <path d="${areaPath(expP)}" fill="url(#trendExpenseGradient)" opacity="0.18" />
                    <path d="${linePath(expP)}" fill="none" stroke="${expColor}" stroke-width="2.5"
                          stroke-linecap="round" stroke-linejoin="round" />

                    <!-- 收入：面积 + 折线 -->
                    <path d="${areaPath(incP)}" fill="url(#trendIncomeGradient)" opacity="0.18" />
                    <path d="${linePath(incP)}" fill="none" stroke="${incColor}" stroke-width="2.5"
                          stroke-linecap="round" stroke-linejoin="round" />

                    <!-- 数据点（带 hover tooltip） -->
                    ${incCircles}
                    ${expCircles}

                    <!-- 数值标签 -->
                    ${incLabels}
                    ${expLabels}

                    <!-- X 轴标签 -->
                    ${xLabels}

                    <defs>
                        <linearGradient id="trendIncomeGradient" x1="0%" x2="0%" y1="0%" y2="100%">
                            <stop offset="0%"   stop-color="${incColor}" stop-opacity="0.55" />
                            <stop offset="100%" stop-color="${incColor}" stop-opacity="0" />
                        </linearGradient>
                        <linearGradient id="trendExpenseGradient" x1="0%" x2="0%" y1="0%" y2="100%">
                            <stop offset="0%"   stop-color="${expColor}" stop-opacity="0.55" />
                            <stop offset="100%" stop-color="${expColor}" stop-opacity="0" />
                        </linearGradient>
                    </defs>
                </svg>`;

            host.innerHTML = svg;
        }

        function init() {
            // 默认按"月"渲染汇总（与当前选中按钮一致）
            updateSummary('month');
            renderTrendChart('month');

            // 时间筛选切换
            const highlighter = document.getElementById('time-highlighter');
            const buttons = document.querySelectorAll('.time-btn');
            buttons.forEach((btn) => {
                btn.addEventListener('click', () => {
                    buttons.forEach((b) => {
                        b.classList.remove('text-on-primary-container', 'font-bold');
                        b.classList.add('text-text-muted');
                    });
                    btn.classList.add('text-on-primary-container', 'font-bold');
                    btn.classList.remove('text-text-muted');
                    const idx = Array.from(buttons).indexOf(btn);
                    highlighter.style.left = `calc(${idx * 33.33}% + ${idx * 2 + 2}px)`;

                    // 按所选时间范围重新计算汇总
                    updateSummary(btn.dataset.range);
                    renderTrendChart(btn.dataset.range);
                });
            });
        }
    </script>
</body>
</html>
