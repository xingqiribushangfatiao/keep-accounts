<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>明细 · Petal Ledger</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../shared/css/tailwind.config.js"></script>
    <link rel="stylesheet" href="../shared/css/tokens.css" />
    <link rel="stylesheet" href="../shared/css/base.css" />
    <style>
        /* 左滑删除 */
        .swipe-row {
            position: relative;
            overflow: hidden;
        }
        .swipe-content {
            transition: transform 0.25s ease;
            will-change: transform;
            touch-action: pan-y;
            position: relative;
            z-index: 1;
        }
        .swipe-action {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 80px;
            background: var(--error);
            color: var(--on-error);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-bg-soft-pink min-h-screen text-on-surface font-body-lg pb-[90px]">

    <!-- 顶部应用栏 -->
    <header class="flex justify-between items-center h-14 px-container-padding w-full z-50 bg-surface/80 backdrop-blur-md border-b border-border-blush sticky top-0 relative">
        <a href="home.html" class="flex items-center gap-1.5 px-3.5 py-2 rounded-full text-primary hover:bg-bg-soft-pink transition-all active:scale-95">
            <span class="material-symbols-outlined text-[22px]">arrow_back</span>
            <span class="font-body-lg text-[18px] font-semibold leading-none">首页</span>
        </a>
        <h1 class="font-headline-md text-headline-md text-on-surface absolute left-1/2 -translate-x-1/2 pointer-events-none">明细</h1>
        <div class="flex items-center gap-2">
            <a href="record.html" aria-label="新增" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors text-primary">
                <span class="material-symbols-outlined">add</span>
            </a>
        </div>
    </header>

    <!-- 时间筛选：日 / 月 / 年（默认月） -->
    <div class="px-container-padding py-3 bg-bg-soft-pink sticky top-14 z-40">
        <div class="flex bg-surface rounded-full p-1 border border-border-blush relative shadow-sm">
            <div id="time-highlighter" class="absolute top-1 bottom-1 w-[calc(33.33%-4px)] bg-primary-container rounded-full shadow-sm z-0"
                 style="left: calc(33.33% + 2px);"></div>
            <button data-range="day"   class="time-btn flex-1 text-center py-2 z-10 font-label-caps text-label-caps text-text-muted">日</button>
            <button data-range="month" class="time-btn flex-1 text-center py-2 z-10 font-label-caps text-label-caps text-on-primary-container font-bold">月</button>
            <button data-range="year"  class="time-btn flex-1 text-center py-2 z-10 font-label-caps text-label-caps text-text-muted">年</button>
        </div>
    </div>

    <!-- 时间范围标签 -->
    <div class="px-container-padding pt-3">
        <h2 id="range-label" class="font-headline-md text-headline-md text-on-surface">2026年8月</h2>
    </div>

    <!-- 分类筛选 chips -->
    <div class="px-container-padding py-2 flex gap-2 overflow-x-auto" id="category-chips">
        <!-- JS 动态渲染 -->
    </div>

    <!-- 支出 -->
    <section class="px-container-padding py-3">
        <div class="flex justify-between items-center mb-3 px-1">
            <h3 id="expense-title" class="font-headline-md text-headline-md text-on-surface">本月支出</h3>
            <span id="expense-section-total" class="font-headline-md text-headline-md text-on-surface">-¥ 0.00</span>
        </div>
        <div id="expense-list" class="flex flex-col gap-card-gap">
            <!-- JS 动态渲染 -->
        </div>
        <div id="expense-empty" class="hidden text-center py-6 text-text-muted font-body-sm text-body-sm">暂无记账记录</div>
    </section>

    <!-- 收入 -->
    <section class="px-container-padding py-3">
        <div class="flex justify-between items-center mb-3 px-1">
            <h3 id="income-title" class="font-headline-md text-headline-md text-on-surface">本月收入</h3>
            <span id="income-section-total" class="font-headline-md text-headline-md text-on-surface">+¥ 0.00</span>
        </div>
        <div id="income-list" class="flex flex-col gap-card-gap">
            <!-- JS 动态渲染 -->
        </div>
        <div id="income-empty" class="hidden text-center py-6 text-text-muted font-body-sm text-body-sm">暂无记账记录</div>
    </section>

    <!-- 整页空状态（完全没有记录） -->
    <div id="empty-state" class="hidden text-center py-20">
        <div class="text-6xl mb-4">📝</div>
        <p class="font-body-lg text-body-lg text-text-muted">还没有记录</p>
        <a href="record.html" class="inline-block mt-4 px-6 py-2 primary-gradient text-on-primary rounded-full font-body-sm text-body-sm font-semibold">记一笔</a>
    </div>

    <!-- 底部导航 -->
    <nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-16 bg-surface/90 backdrop-blur-lg px-2 pb-safe z-50 rounded-t-xl border-t border-border-blush"
         style="box-shadow: var(--shadow-bottom-nav);">
        <a href="home.html" class="flex flex-col items-center justify-center px-4 py-1 transition-colors flex-1 text-text-muted hover:text-primary">
            <span class="material-symbols-outlined">home</span>
            <span class="font-label-caps text-label-caps mt-1">首页</span>
        </a>
        <a href="list.html" class="flex flex-col items-center justify-center px-4 py-1 transition-colors flex-1 text-primary font-bold bg-primary-container/20 rounded-xl scale-90">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">receipt_long</span>
            <span class="font-label-caps text-label-caps mt-1">明细</span>
        </a>
        <a href="stats.html" class="flex flex-col items-center justify-center px-4 py-1 transition-colors flex-1 text-text-muted hover:text-primary">
            <span class="material-symbols-outlined">leaderboard</span>
            <span class="font-label-caps text-label-caps mt-1">统计</span>
        </a>
        <a href="settings.html" class="flex flex-col items-center justify-center px-4 py-1 transition-colors flex-1 text-text-muted hover:text-primary">
            <span class="material-symbols-outlined">settings</span>
            <span class="font-label-caps text-label-caps mt-1">设置</span>
        </a>
    </nav>

    <script src="../shared/js/auth.js"></script>
    <script src="../shared/js/utils.js"></script>
    <script src="../shared/js/data.js"></script>
    <script src="../shared/js/nav.js"></script>

    <script>
        if (!Auth.requireAuth()) {} else { init(); }

        /* ========== 状态 ========== */
        const state = {
            range: 'month',              // day | week | month
            filterCategory: 'all',       // all | expense | income | 具体 catId
        };

        const RANGE_PREFIX = { day: '本日', year: '本年', month: '本月' };

        function init() {
            bindEvents();
            renderChips();
            render();
        }

        function bindEvents() {
            // 时间范围切换
            const highlighter = document.getElementById('time-highlighter');
            const buttons = document.querySelectorAll('.time-btn');
            buttons.forEach((btn) => {
                btn.addEventListener('click', () => {
                    buttons.forEach((b) => {
                        b.classList.remove('text-on-primary-container', 'font-bold');
                        b.classList.add('text-text-muted');
                    });
                    btn.classList.add('text-on-primary-container', 'font-bold');
                    btn.classList.remove('text-text-muted');
                    const idx = Array.from(buttons).indexOf(btn);
                    highlighter.style.left = `calc(${idx * 33.33}% + ${idx * 2 + 2}px)`;

                    state.range = btn.dataset.range;
                    render();
                });
            });
        }

        /* ========== 时间范围工具（与 stats.html 思路一致）========== */
        function parseLocalDate(str) {
            const [y, m, d] = str.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function getRangeBounds(range) {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            let start, end;
            if (range === 'day') {
                start = today;
                end = new Date(today); end.setHours(23, 59, 59, 999);
            } else if (range === 'month') {
                start = new Date(today.getFullYear(), today.getMonth(), 1);
                end   = new Date(today.getFullYear(), today.getMonth() + 1, 0);
                end.setHours(23, 59, 59, 999);
            } else { // year
                start = new Date(today.getFullYear(), 0, 1);
                end   = new Date(today.getFullYear(), 11, 31);
                end.setHours(23, 59, 59, 999);
            }
            return { start, end };
        }

        function getRangeLabel(range) {
            const { start, end } = getRangeBounds(range);
            if (range === 'day') {
                return `${start.getMonth() + 1}月${start.getDate()}日`;
            } else if (range === 'month') {
                return `${start.getFullYear()}年${start.getMonth() + 1}月`;
            } else {
                return `${start.getFullYear()}年`;
            }
        }

        function inRange(dateStr, start, end) {
            const d = parseLocalDate(dateStr);
            return d >= start && d <= end;
        }

        /* ========== 分类 chips ========== */
        function renderChips() {
            const container = document.getElementById('category-chips');
            const chips = [
                { id: 'all',     label: '全部', emoji: '📊' },
                { id: 'expense', label: '支出', emoji: '📉' },
                { id: 'income',  label: '收入', emoji: '📈' },
            ];
            container.innerHTML = chips.map((c) => {
                const active = state.filterCategory === c.id;
                return `
                    <button data-chip="${c.id}"
                            class="chip flex-shrink-0 px-4 py-1.5 rounded-full text-sm font-medium transition-colors flex items-center gap-1
                                   ${active ? 'bg-primary text-on-primary' : 'bg-surface-white text-on-surface-variant border border-border-blush'}">
                        <span>${c.emoji}</span>${c.label}
                    </button>`;
            }).join('') + MockData.expenseCategories.slice(0, 6).map((c) => {
                const active = state.filterCategory === c.id;
                return `
                    <button data-chip="${c.id}"
                            class="chip flex-shrink-0 px-4 py-1.5 rounded-full text-sm font-medium transition-colors flex items-center gap-1
                                   ${active ? 'bg-primary text-on-primary' : 'bg-surface-white text-on-surface-variant border border-border-blush'}">
                        <span>${c.emoji}</span>${c.name}
                    </button>`;
            }).join('');

            container.querySelectorAll('.chip').forEach((btn) => {
                btn.addEventListener('click', () => {
                    state.filterCategory = btn.dataset.chip;
                    renderChips();
                    render();
                });
            });
        }

        /* ========== 单行（参照 home.html "最近记录" 的样式）========== */
        function renderRow(r) {
            const cat = MockData.getCategoryById(r.categoryId);
            const isIncome = r.type === 'income';
            const sign = isIncome ? '+' : '-';
            // 支出：红色；收入：主题粉色（text-primary）
            const amountColor = isIncome ? 'text-primary' : 'text-expense-red';
            return `
                <div class="swipe-row surface-card rounded-xl" data-id="${r.id}">
                    <div class="swipe-content bg-surface-white rounded-xl p-4 flex items-center gap-4 active:bg-surface-container-lowest">
                        <div class="w-12 h-12 rounded-full overflow-hidden flex items-center justify-center shrink-0 text-2xl"
                             style="background-color: ${cat.color}20">${cat.emoji}</div>
                        <div class="flex-1 flex flex-col justify-center min-w-0">
                            <span class="font-body-lg text-body-lg text-on-surface truncate">${cat.name}</span>
                            <span class="font-body-sm text-body-sm text-text-muted truncate">${Utils.escapeHtml(r.note || '')}</span>
                        </div>
                        <span class="font-headline-md text-headline-md ${amountColor} shrink-0">${sign} ${Utils.formatCurrency(r.amount, false)}</span>
                    </div>
                    <div class="swipe-action">
                        <div class="flex flex-col items-center">
                            <span class="material-symbols-outlined">delete</span>
                            <span class="text-xs">删除</span>
                        </div>
                    </div>
                </div>`;
        }

        /* ========== 渲染 ========== */
        function render() {
            const prefix = RANGE_PREFIX[state.range];
            const { start, end } = getRangeBounds(state.range);

            // 标题 / 时间范围标签
            document.getElementById('range-label').textContent = getRangeLabel(state.range);
            document.getElementById('expense-title').textContent = `${prefix}支出`;
            document.getElementById('income-title').textContent  = `${prefix}收入`;

            // 日期范围过滤
            let records = MockData.transactions.filter((r) => inRange(r.date, start, end));

            // 分类过滤
            if (state.filterCategory === 'expense') {
                records = records.filter((r) => r.type === 'expense');
            } else if (state.filterCategory === 'income') {
                records = records.filter((r) => r.type === 'income');
            } else if (state.filterCategory !== 'all') {
                records = records.filter((r) => r.categoryId === state.filterCategory);
            }

            // 分离支出/收入
            const expenses = records.filter((r) => r.type === 'expense')
                                    .sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
            const incomes  = records.filter((r) => r.type === 'income')
                                    .sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);

            // 总额
            const totalExp = expenses.reduce((s, r) => s + r.amount, 0);
            const totalInc = incomes.reduce((s, r) => s + r.amount, 0);
            document.getElementById('expense-section-total').textContent = '- ' + Utils.formatCurrency(totalExp, false);
            document.getElementById('income-section-total').textContent  = '+ ' + Utils.formatCurrency(totalInc, false);

            // 完全无记录
            const empty = document.getElementById('empty-state');
            if (records.length === 0) {
                document.getElementById('expense-list').innerHTML = '';
                document.getElementById('income-list').innerHTML  = '';
                document.getElementById('expense-empty').classList.add('hidden');
                document.getElementById('income-empty').classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            // 支出列表
            const expenseList = document.getElementById('expense-list');
            const expenseEmpty = document.getElementById('expense-empty');
            if (expenses.length === 0) {
                expenseList.innerHTML = '';
                expenseEmpty.classList.remove('hidden');
            } else {
                expenseEmpty.classList.add('hidden');
                expenseList.innerHTML = expenses.map((r) => renderRow(r)).join('');
            }

            // 收入列表
            const incomeList = document.getElementById('income-list');
            const incomeEmpty = document.getElementById('income-empty');
            if (incomes.length === 0) {
                incomeList.innerHTML = '';
                incomeEmpty.classList.remove('hidden');
            } else {
                incomeEmpty.classList.add('hidden');
                incomeList.innerHTML = incomes.map((r) => renderRow(r)).join('');
            }

            // 左滑删除
            bindSwipe();
        }

        function bindSwipe() {
            const rows = document.querySelectorAll('.swipe-row');
            rows.forEach((row) => {
                const content = row.querySelector('.swipe-content');
                const action = row.querySelector('.swipe-action');
                let startX = 0;
                let currentX = 0;
                let dragging = false;

                const onStart = (e) => {
                    const t = e.touches ? e.touches[0] : e;
                    startX = t.clientX;
                    dragging = true;
                    content.style.transition = 'none';
                };
                const onMove = (e) => {
                    if (!dragging) return;
                    const t = e.touches ? e.touches[0] : e;
                    currentX = Math.min(0, t.clientX - startX);
                    currentX = Math.max(-100, currentX);
                    content.style.transform = `translateX(${currentX}px)`;
                };
                const onEnd = () => {
                    if (!dragging) return;
                    dragging = false;
                    content.style.transition = 'transform 0.25s ease';
                    if (currentX < -50) {
                        content.style.transform = 'translateX(-80px)';
                    } else {
                        content.style.transform = 'translateX(0)';
                    }
                    currentX = 0;
                };

                content.addEventListener('touchstart', onStart, { passive: true });
                content.addEventListener('touchmove', onMove, { passive: true });
                content.addEventListener('touchend', onEnd);

                action.addEventListener('click', () => {
                    const id = row.dataset.id;
                    if (confirm('确定删除这条记录吗？')) {
                        const idx = MockData.transactions.findIndex((t) => t.id === id);
                        if (idx > -1) MockData.transactions.splice(idx, 1);
                        render();
                    }
                });
            });
        }
    </script>
</body>
</html>
