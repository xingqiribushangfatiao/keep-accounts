<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>明细 · Petal Ledger</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="../shared/css/tokens.css" />
    <link rel="stylesheet" href="../shared/css/base.css" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        surface: 'var(--surface)',
                        'surface-white': 'var(--surface-white)',
                        'bg-soft-pink': 'var(--bg-soft-pink)',
                        primary: 'var(--primary)',
                        'primary-container': 'var(--primary-container)',
                        'on-primary': 'var(--on-primary)',
                        'on-surface': 'var(--on-surface)',
                        'text-muted': 'var(--text-muted)',
                        'border-blush': 'var(--border-blush)',
                        'expense-red': 'var(--expense-red)',
                        'income-teal': 'var(--income-teal)',
                    },
                    borderRadius: { full: 'var(--radius-full)', xl: 'var(--radius-xl)', '2xl': 'var(--radius-2xl)' },
                    fontFamily: { body: ['Be Vietnam Pro', 'sans-serif'], display: ['Plus Jakarta Sans', 'sans-serif'] },
                },
            },
        };
    </script>
    <style>
        .swipe-row { position: relative; overflow: hidden; border-radius: var(--radius-xl); }
        .swipe-content {
            transition: transform 0.25s ease;
            will-change: transform;
            touch-action: pan-y;
            position: relative;
            z-index: 1;
            background: var(--surface-white);
        }
        .swipe-action {
            position: absolute;
            top: 0; right: 0; bottom: 0;
            width: 80px;
            background: var(--expense-red);
            color: white;
            display: flex; align-items: center; justify-content: center;
            font-weight: 600;
            border-radius: var(--radius-xl);
        }
    </style>
</head>
<body class="bg-bg-soft-pink min-h-screen text-on-surface font-body pb-24">

    <main class="max-w-md mx-auto pb-8">

        <!-- 标题 -->
        <header class="px-5 pt-6 pb-3">
            <h1 class="font-display text-[22px] font-bold text-center">收支明细</h1>
        </header>

        <!-- 月份 + 类型 选择器 -->
        <div class="px-5 flex items-center justify-between mb-3">
            <button id="btn-month" class="flex items-center gap-1 px-3.5 py-1.5 rounded-full bg-surface-white border border-border-blush text-[13px] text-on-surface font-medium">
                <span id="current-month">2026年8月</span>
                <span class="material-symbols-outlined text-[16px] text-text-muted">expand_more</span>
            </button>
            <button id="btn-type" class="flex items-center gap-1 px-3.5 py-1.5 rounded-full bg-surface-white border border-border-blush text-[13px] text-on-surface font-medium">
                <span>全部类型</span>
                <span class="material-symbols-outlined text-[16px] text-text-muted">expand_more</span>
            </button>
        </div>

        <!-- 记录列表（按日期分组） -->
        <div id="list-container" class="px-5 space-y-5">
            <!-- JS 动态渲染 -->
        </div>
    </main>

    <!-- 底部导航 -->
    <div id="bottom-nav" data-active="list"></div>

    <script src="../shared/js/auth.js"></script>
    <script src="../shared/js/utils.js"></script>
    <script src="../shared/js/data.js"></script>
    <script src="../shared/js/nav.js"></script>

    <script>
        /* ========== 筛选状态 ========== */
        let filterMonth = (() => {
            const n = new Date();
            return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}`;
        })();
        let filterType = 'all';   // 'all' | 'expense' | 'income'

        if (!Auth.requireAuth()) {} else { init(); }

        async function init() {
            try {
                await MockData.init();
            } catch (err) {
                console.error('[list] 数据加载失败:', err);
            }
            bindFilters();
            renderList();
            BottomNav.init();
        }

        function bindFilters() {
            // 月份按钮:循环切换 (本月 → 上月 → 上上月 → ... → 本月)
            document.getElementById('btn-month').addEventListener('click', () => {
                const [y, m] = filterMonth.split('-').map(Number);
                let ny = y, nm = m - 1;
                if (nm < 1) { ny--; nm = 12; }
                // 不能早于数据起始月(本 MVP 不限,允许 2000 之前的)
                if (ny < 2000) return;
                filterMonth = `${ny}-${String(nm).padStart(2, '0')}`;
                updateMonthLabel();
                renderList();
            });
            // 类型按钮:循环切换 全部 → 支出 → 收入 → 全部
            document.getElementById('btn-type').addEventListener('click', () => {
                const order = ['all', 'expense', 'income'];
                const idx = order.indexOf(filterType);
                filterType = order[(idx + 1) % order.length];
                document.querySelector('#btn-type > span:first-child').textContent =
                    filterType === 'all'      ? '全部类型' :
                    filterType === 'expense' ? '仅支出'   : '仅收入';
                renderList();
            });
            updateMonthLabel();
        }

        function updateMonthLabel() {
            const [y, m] = filterMonth.split('-').map(Number);
            document.getElementById('current-month').textContent = `${y}年${m}月`;
        }

        /* ========== 列表渲染 ========== */
        function renderList() {
            // 按月 + 按类型过滤(纯前端过滤,缓存里已有最近 500 条)
            const filtered = MockData.transactions.filter((t) => {
                const monthOk = t.date.startsWith(filterMonth);
                const typeOk  = filterType === 'all' || t.type === filterType;
                return monthOk && typeOk;
            });

            // 按日期分组
            const groups = {};
            filtered.forEach((t) => {
                if (!groups[t.date]) groups[t.date] = [];
                groups[t.date].push(t);
            });
            const dates = Object.keys(groups).sort((a, b) => b.localeCompare(a));

            const container = document.getElementById('list-container');
            if (!dates.length) {
                container.innerHTML = `
                <div class="bg-surface-white rounded-2xl p-8 text-center text-text-muted text-[13px] border border-border-blush">
                    本月暂无记录
                </div>`;
                return;
            }

            container.innerHTML = dates.map((date) => {
                const items = groups[date].sort((a, b) => b.createdAt - a.createdAt);
                const dayExp = items.filter((i) => i.type === 'expense').reduce((s, i) => s + i.amount, 0);
                const dayInc = items.filter((i) => i.type === 'income').reduce((s, i) => s + i.amount, 0);
                const rel = Utils.relativeDate(date);
                const dateLabel = `${rel} ${Utils.formatDate(date)}`;
                return `
                <section>
                    <div class="flex justify-between items-center mb-2 px-1">
                        <h3 class="text-[14px] font-semibold text-on-surface">${dateLabel}</h3>
                        <p class="text-[12px] text-text-muted">
                            支出: <span class="text-expense-red font-semibold">${Utils.formatCurrency(dayExp, false)}</span>
                            <span class="mx-1.5">|</span>
                            收入: <span class="text-income-teal font-semibold">${Utils.formatCurrency(dayInc, false)}</span>
                        </p>
                    </div>
                    <div class="space-y-2.5">
                        ${items.map((r) => renderRow(r)).join('')}
                    </div>
                </section>`;
            }).join('');

            bindSwipe();
        }

        function renderRow(r) {
            const cat = MockData.getCategoryById(r.categoryId) || { name: '其他', emoji: '📦', color: '#8395A7' };
            const isIncome = r.type === 'income';
            const sign = isIncome ? '+' : '-';
            const amountColor = isIncome ? 'text-income-teal' : 'text-expense-red';
            const time = Utils.formatTime(r.createdAt);
            return `
            <div class="swipe-row" data-id="${r.id}">
                <div class="swipe-content p-3.5 flex items-center gap-3">
                    <div class="w-11 h-11 rounded-full flex items-center justify-center text-2xl shrink-0" style="background-color: ${cat.color}22;">${cat.emoji}</div>
                    <div class="flex-1 min-w-0">
                        <p class="text-[14px] font-semibold text-on-surface leading-tight">${cat.name}</p>
                        <p class="text-[12px] text-text-muted mt-0.5 truncate">${Utils.escapeHtml(r.note) || '无备注'}</p>
                    </div>
                    <div class="text-right shrink-0">
                        <p class="font-display text-[15px] font-bold ${amountColor}">${sign}${Utils.formatCurrency(r.amount, false)}</p>
                        <p class="text-[11px] text-text-muted mt-0.5">${time}</p>
                    </div>
                </div>
                <div class="swipe-action">
                    <div class="flex flex-col items-center">
                        <span class="material-symbols-outlined text-[20px]">delete</span>
                        <span class="text-[11px] mt-0.5">删除</span>
                    </div>
                </div>
            </div>`;
        }

        /* ========== 左滑删除(走 API)========== */
        function bindSwipe() {
            const rows = document.querySelectorAll('.swipe-row');
            rows.forEach((row) => {
                const content = row.querySelector('.swipe-content');
                const action = row.querySelector('.swipe-action');
                let startX = 0, currentX = 0, dragging = false;

                const onStart = (e) => {
                    const t = e.touches ? e.touches[0] : e;
                    startX = t.clientX;
                    dragging = true;
                    content.style.transition = 'none';
                };
                const onMove = (e) => {
                    if (!dragging) return;
                    const t = e.touches ? e.touches[0] : e;
                    currentX = Math.min(0, t.clientX - startX);
                    currentX = Math.max(-100, currentX);
                    content.style.transform = `translateX(${currentX}px)`;
                };
                const onEnd = () => {
                    if (!dragging) return;
                    dragging = false;
                    content.style.transition = 'transform 0.25s ease';
                    content.style.transform = currentX < -50 ? 'translateX(-80px)' : 'translateX(0)';
                    currentX = 0;
                };

                content.addEventListener('touchstart', onStart, { passive: true });
                content.addEventListener('touchmove', onMove, { passive: true });
                content.addEventListener('touchend', onEnd);

                action.addEventListener('click', async () => {
                    const id = parseInt(row.dataset.id, 10);
                    if (!confirm('确定删除这条记录吗?')) return;
                    try {
                        await MockData.deleteTransaction(id);
                        renderList();
                    } catch (err) {
                        alert('删除失败:' + (err.message || '未知错误'));
                    }
                });
            });
        }
    </script>
</body>
</html>
