<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>统计 · Petal Ledger</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="../shared/css/tokens.css" />
    <link rel="stylesheet" href="../shared/css/base.css" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        surface: 'var(--surface)',
                        'surface-white': 'var(--surface-white)',
                        'bg-soft-pink': 'var(--bg-soft-pink)',
                        primary: 'var(--primary)',
                        'primary-container': 'var(--primary-container)',
                        'on-primary': 'var(--on-primary)',
                        'on-surface': 'var(--on-surface)',
                        'text-muted': 'var(--text-muted)',
                        'text-disabled': 'var(--text-disabled)',
                        'border-blush': 'var(--border-blush)',
                        'expense-red': 'var(--expense-red)',
                        'income-teal': 'var(--income-teal)',
                    },
                    borderRadius: { full: 'var(--radius-full)', xl: 'var(--radius-xl)', '2xl': 'var(--radius-2xl)' },
                    fontFamily: { body: ['Be Vietnam Pro', 'sans-serif'], display: ['Plus Jakarta Sans', 'sans-serif'] },
                    backgroundImage: { 'primary-gradient': 'var(--primary-gradient)' },
                },
            },
        };
    </script>
    <style>
        .range-tab {
            padding: 6px 18px;
            border-radius: var(--radius-full);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            transition: all 0.2s;
        }
        .range-tab.active {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 2px 8px rgba(255,107,157,0.25);
        }
        .progress-bar {
            height: 6px;
            background: var(--surface-container);
            border-radius: var(--radius-full);
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: var(--radius-full);
            transition: width 0.6s ease;
        }
    </style>
</head>
<body class="bg-bg-soft-pink min-h-screen text-on-surface font-body pb-24">

    <main class="mx-auto pb-8 w-full max-w-[390px]" style="min-height: 844px;">

        <!-- 标题 -->
        <header class="px-5 pt-6 pb-4">
            <h1 class="font-display text-[20px] font-bold text-center">统计图表</h1>
        </header>

        <!-- 时间范围切换器 -->
        <div class="px-5 mb-5 flex justify-center">
            <div class="flex items-center gap-1 p-1 bg-surface-white rounded-full border border-border-blush">
                <button class="range-tab" data-range="week">本周</button>
                <button class="range-tab active" data-range="month">本月</button>
                <button class="range-tab" data-range="year">本年</button>
            </div>
        </div>

        <!-- 总支出 / 总收入 双卡（白色，无渐变） -->
        <section class="px-5 mb-5">
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-surface-white rounded-2xl p-4 border border-border-blush">
                    <p class="text-[13px] text-text-muted mb-2">总支出</p>
                    <p class="font-display text-[20px] font-extrabold text-primary" id="total-expense">¥3,280.50</p>
                </div>
                <div class="bg-surface-white rounded-2xl p-4 border border-border-blush">
                    <p class="text-[13px] text-text-muted mb-2">总收入</p>
                    <p class="font-display text-[20px] font-extrabold text-income-teal" id="total-income">¥8,500.00</p>
                </div>
            </div>
        </section>

        <!-- 支出 / 收入 构成分析 环形图(左右并排) -->
        <section class="px-5 mb-6">
            <div class="grid grid-cols-2 gap-3">
                <!-- 支出构成 -->
                <div class="bg-surface-white rounded-2xl p-4 border border-border-blush">
                    <h3 class="font-display text-[14px] font-bold text-on-surface mb-3 text-center">支出构成</h3>
                    <div class="relative w-[110px] h-[110px] mx-auto mb-3">
                        <svg viewBox="0 0 100 100" class="w-full h-full -rotate-90">
                            <circle cx="50" cy="50" r="40" fill="none" stroke="var(--surface-container)" stroke-width="16" />
                            <g id="donut-segments"></g>
                        </svg>
                        <div class="absolute inset-0 flex flex-col items-center justify-center">
                            <p class="text-[9px] text-text-muted">总支出</p>
                            <p class="font-display text-[11px] font-extrabold text-on-surface leading-tight" id="donut-center-amount">¥0</p>
                        </div>
                    </div>
                    <div class="flex flex-col gap-1.5" id="donut-legend"></div>
                </div>
                <!-- 收入构成 -->
                <div class="bg-surface-white rounded-2xl p-4 border border-border-blush">
                    <h3 class="font-display text-[14px] font-bold text-on-surface mb-3 text-center">收入构成</h3>
                    <div class="relative w-[110px] h-[110px] mx-auto mb-3">
                        <svg viewBox="0 0 100 100" class="w-full h-full -rotate-90">
                            <circle cx="50" cy="50" r="40" fill="none" stroke="var(--surface-container)" stroke-width="16" />
                            <g id="donut-segments-income"></g>
                        </svg>
                        <div class="absolute inset-0 flex flex-col items-center justify-center">
                            <p class="text-[9px] text-text-muted">总收入</p>
                            <p class="font-display text-[11px] font-extrabold text-on-surface leading-tight" id="donut-center-amount-income">¥0</p>
                        </div>
                    </div>
                    <div class="flex flex-col gap-1.5" id="donut-legend-income"></div>
                </div>
            </div>
        </section>

        <!-- 分类排行 -->
        <section class="px-5">
            <h3 class="font-display text-[15px] font-bold text-on-surface mb-3">分类排行</h3>
            <div class="space-y-3" id="category-rank"></div>
        </section>
    </main>

    <!-- 底部导航（中间包含 [+] 记一笔按钮）-->
    <div id="bottom-nav" data-active="stats"></div>

    <script src="../shared/js/auth.js"></script>
    <script src="../shared/js/utils.js"></script>
    <!-- data.js / nav.js 不需要:本页只打 1 次 /api/stats/summary,category 信息已在返回里 -->
    <script src="../shared/js/nav.js"></script>

    <script>
        /* ========== 状态 ==========
         * 每次切 range 都重新打 /api/stats/summary?range=X
         * 分类信息(name / icon / color) 后端在 byCategory / byCategoryIncome
         * 里直接带回,前端不需要再走 MockData / categories 接口,
         * 因此本页只打 1 次 API,刷新即一致
         */
        let currentRange = 'month';
        let _summary = null;                // 当前 range 的 summary(后端原始)
        let _categoryStats        = [];     // 支出分类(带 name/icon/color/amount/percent)
        let _categoryStatsIncome  = [];     // 收入分类(同上)

        if (!Auth.requireAuth()) {} else { init(); }

        async function init() {
            bindRangeTabs();
            await loadAndRender(currentRange);
            BottomNav.init();
        }

        async function loadAndRender(range) {
            currentRange = range;
            try {
                const data = await Auth.apiFetch(`/stats/summary?range=${range}`, { method: 'GET' });
                _summary = (data && data.data) || { totalExpense: 0, totalIncome: 0, byCategory: [], byCategoryIncome: [] };
            } catch (err) {
                console.error('[stats] 拉 summary 失败:', err);
                _summary = { totalExpense: 0, totalIncome: 0, byCategory: [], byCategoryIncome: [] };
            }

            // 直接吃后端返回的 name/icon/color,不再二次请求 categories
            _categoryStats       = normalizeRows(_summary.byCategory);
            _categoryStatsIncome = normalizeRows(_summary.byCategoryIncome);

            renderRange();
            renderDonut('expense');
            renderDonut('income');
            renderRank();
        }

        /* 把后端返回的 byCategory / byCategoryIncome 归一化,保留
         * categoryId / name / icon / color / amount / percent,
         * 渲染层就不再依赖 MockData.getCategoryById 也不依赖 COLOR_OVERRIDE
         */
        function normalizeRows(rows) {
            if (!Array.isArray(rows)) return [];
            return rows.map((r) => ({
                categoryId: r.categoryId,
                name:       r.name,
                icon:       r.icon || '📦',
                color:      r.color || '#FF6B9D',
                amount:     Number(r.amount) || 0,
                percent:    Number(r.percent) || 0,
            }));
        }

        function renderRange() {
            document.getElementById('total-expense').textContent = Utils.formatCurrency(Number(_summary.totalExpense || 0));
            document.getElementById('total-income').textContent  = Utils.formatCurrency(Number(_summary.totalIncome  || 0));
        }

        function bindRangeTabs() {
            document.querySelectorAll('.range-tab').forEach((tab) => {
                tab.addEventListener('click', async () => {
                    document.querySelectorAll('.range-tab').forEach((t) => t.classList.remove('active'));
                    tab.classList.add('active');
                    await loadAndRender(tab.dataset.range);
                });
            });
        }

        /* 通用环形图渲染:type = 'expense' | 'income'
         * 数据项的 name/icon/color 已在 normalizeRows 时从 API 落好
         */
        function renderDonut(type) {
            const data        = type === 'income' ? _categoryStatsIncome : _categoryStats;
            const segId       = type === 'income' ? 'donut-segments-income' : 'donut-segments';
            const legendId    = type === 'income' ? 'donut-legend-income'  : 'donut-legend';
            const amountId    = type === 'income' ? 'donut-center-amount-income' : 'donut-center-amount';
            const totalAmount = Number(type === 'income' ? (_summary.totalIncome  || 0)
                                                    : (_summary.totalExpense || 0));
            const emptyText   = type === 'income' ? '本周期暂无收入' : '本周期暂无支出';

            document.getElementById(amountId).textContent = Utils.formatCurrency(totalAmount);

            const radius = 40, circumference = 2 * Math.PI * radius;
            const segsEl    = document.getElementById(segId);
            const legendEl  = document.getElementById(legendId);

            if (!data.length) {
                segsEl.innerHTML = '';
                legendEl.innerHTML = `<div class="text-text-muted text-[11px] text-center">${emptyText}</div>`;
                return;
            }

            let offset = 0;
            const segs = data.map((item) => {
                const frac = item.percent / 100;
                const len = frac * circumference;
                const el = `<circle cx="50" cy="50" r="${radius}" fill="none"
                                stroke="${item.color}"
                                stroke-width="16"
                                stroke-dasharray="${len} ${circumference}"
                                stroke-dashoffset="${-offset}" />`;
                offset += len;
                return el;
            }).join('');
            segsEl.innerHTML = segs;

            legendEl.innerHTML = data.slice(0, 5).map((item) => `
                <div class="flex items-center gap-1.5 text-[11px] leading-tight">
                    <span class="w-2 h-2 rounded-full shrink-0" style="background-color: ${item.color};"></span>
                    <span class="text-on-surface truncate">${Utils.escapeHtml(item.name)}</span>
                    <span class="text-text-muted font-medium ml-auto">${item.percent}%</span>
                </div>`).join('');
        }

        /* 分类排行:支出 / 收入 分两组,各取 Top 5
         * name / icon / color 全部来自 normalizeRows 后的 item
         */
        function renderRank() {
            const host = document.getElementById('category-rank');
            const expData = [..._categoryStats].sort((a, b) => b.amount - a.amount);
            const incData = [..._categoryStatsIncome].sort((a, b) => b.amount - a.amount);

            if (!expData.length && !incData.length) {
                host.innerHTML = `<div class="bg-surface-white rounded-2xl p-6 text-center text-text-muted text-[13px] border border-border-blush">本周期暂无记录</div>`;
                return;
            }

            const block = (title, items, sign, accent) => {
                if (!items.length) {
                    return `
                    <div class="mb-5">
                        <div class="flex items-center justify-between mb-2.5 px-1">
                            <h4 class="font-display text-[14px] font-bold text-on-surface">${title}</h4>
                            <span class="text-[11px] text-text-muted">本周期 0 笔</span>
                        </div>
                        <div class="bg-surface-white rounded-2xl p-5 text-center text-text-muted text-[12px] border border-border-blush">本周期暂无${title.replace('分类排行','').trim() || '数据'}</div>
                    </div>`;
                }
                const rows = items.map((item) => `
                    <div class="bg-surface-white rounded-2xl p-3.5 border border-border-blush mb-2.5">
                        <div class="flex items-center gap-3 mb-2">
                            <div class="w-9 h-9 rounded-full flex items-center justify-center text-lg shrink-0" style="background-color: ${item.color}22;">${item.icon}</div>
                            <div class="flex-1 min-w-0">
                                <p class="text-[14px] font-semibold text-on-surface">${Utils.escapeHtml(item.name)}</p>
                            </div>
                            <div class="text-right">
                                <p class="font-display text-[15px] font-bold ${accent} leading-tight">${sign}${Utils.formatCurrency(item.amount, false)}</p>
                                <p class="text-[11px] text-text-muted mt-0.5">${item.percent}%</p>
                            </div>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${item.percent}%; background-color: ${item.color};"></div>
                        </div>
                    </div>`).join('');
                return `
                <div class="mb-5">
                    <div class="flex items-center justify-between mb-2.5 px-1">
                        <h4 class="font-display text-[14px] font-bold text-on-surface">${title}</h4>
                        <span class="text-[11px] text-text-muted">本周期 ${items.length} 类</span>
                    </div>
                    ${rows}
                </div>`;
            };

            host.innerHTML = block('支出分类排行', expData.slice(0, 5), '-', 'text-expense-red')
                           + block('收入分类排行', incData.slice(0, 5), '+', 'text-income-teal');
        }
    </script>
</body>
</html>
