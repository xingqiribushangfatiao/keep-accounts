<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Petal Ledger · 随手记账</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
        body { margin: 0; background: #FFE9EC; font-family: 'Be Vietnam Pro', sans-serif; }
        .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
        .boot-logo { width: 80px; height: 80px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 40px; box-shadow: 0 8px 24px rgba(255,107,157,0.25); }
        .boot-name { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 800; color: #FF6B9D; letter-spacing: 0.5px; }
        .boot-hint { font-size: 12px; color: #8B6B73; }
    </style>
</head>
<body>
    <div class="boot">
        <div class="boot-logo">💖</div>
        <div class="boot-name">随手记账</div>
        <div class="boot-hint">正在加载中...</div>
    </div>
    <script src="shared/js/auth.js"></script>
    <script>
        if (Auth.isLoggedIn()) {
            window.location.replace('pages/home.html');
        } else {
            window.location.replace('pages/login.html');
        }
    </script>
</body>
</html>
