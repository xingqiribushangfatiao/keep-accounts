<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>记账 · Petal Ledger</title>

    <!-- 关键 CSS 内联：让加载界面立刻可见，不等外部资源 -->
    <style>
        html, body { margin: 0; padding: 0; background: #FFE9EC; }
        /* 加载遮罩：纯 CSS，无需 JS 即可显示 */
        #app-loader {
            position: fixed; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #FFE9EC; z-index: 9999;
            transition: opacity 0.3s ease;
        }
        #app-loader.fade-out { opacity: 0; pointer-events: none; }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid #FFD9E1;
            border-top-color: #FF6B9D;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loader-text { margin-top: 12px; color: #8B6B73; font-size: 13px; font-family: -apple-system, sans-serif; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 隐藏主内容直到 init() 完成（防止布局闪烁）*/
        #app-content { visibility: hidden; }
        #app-content.ready { visibility: visible; }
    </style>

    <!-- 关键字体预加载，避免 FOIT 阻塞渲染 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet" />

    <!-- Tailwind Play CDN：加 defer，避免阻塞首屏渲染 -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries" defer></script>
    <script defer>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        surface: 'var(--surface)',
                        'surface-white': 'var(--surface-white)',
                        'surface-container-low': 'var(--surface-container-low)',
                        'surface-container-high': 'var(--surface-container-high)',
                        'bg-soft-pink': 'var(--bg-soft-pink)',
                        primary: 'var(--primary)',
                        'primary-container': 'var(--primary-container)',
                        'on-primary': 'var(--on-primary)',
                        'on-surface': 'var(--on-surface)',
                        'on-surface-variant': 'var(--on-surface-variant)',
                        'text-muted': 'var(--text-muted)',
                        'text-disabled': 'var(--text-disabled)',
                        'border-blush': 'var(--border-blush)',
                        'expense-red': 'var(--expense-red)',
                        'income-teal': 'var(--income-teal)',
                    },
                    borderRadius: { full: 'var(--radius-full)', xl: 'var(--radius-xl)', '2xl': 'var(--radius-2xl)' },
                    fontFamily: { body: ['Be Vietnam Pro', 'sans-serif'], display: ['Plus Jakarta Sans', 'sans-serif'] },
                    backgroundImage: { 'primary-gradient': 'linear-gradient(135deg, #FF6B9D 0%, #FFB1C5 100%)' },
                },
            },
        };
    </script>

    <link rel="stylesheet" href="../shared/css/tokens.css" />
    <link rel="stylesheet" href="../shared/css/base.css" />

    <style>
        .keypad-btn { transition: background-color 0.1s ease; }
        .keypad-btn:active { background-color: #ffd9e0; }
    </style>
</head>
<body class="bg-bg-soft-pink text-on-surface font-body min-h-screen flex flex-col overflow-hidden">

    <!-- 加载遮罩（纯 CSS 显示，JS 完成后淡出）-->
    <div id="app-loader">
        <div class="spinner"></div>
        <div class="loader-text">正在加载…</div>
    </div>

    <!-- 主内容：初始 visibility:hidden，init() 完成后显示 -->
    <div id="app-content">
        <!-- 顶部应用栏 -->
        <header class="flex justify-between items-center h-14 px-4 w-full z-50 bg-surface-white/80 backdrop-blur-md border-b border-border-blush flex-shrink-0">
            <a href="home.html" aria-label="关闭" class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:bg-bg-soft-pink rounded-full active:scale-95">
                <span class="material-symbols-outlined">close</span>
            </a>
            <div class="flex bg-surface-container-high rounded-full p-1 relative w-48 shadow-inner">
                <div class="absolute h-[calc(100%-8px)] w-[calc(50%-4px)] bg-surface-white rounded-full shadow-sm transition-transform duration-300 ease-in-out left-1 top-1" id="segment-highlighter"></div>
                <button id="btn-expense" class="flex-1 relative z-10 py-1.5 text-center text-expense-red font-bold transition-colors text-[13px]">支出</button>
                <button id="btn-income" class="flex-1 relative z-10 py-1.5 text-center text-text-muted transition-colors text-[13px]">收入</button>
            </div>
            <div class="w-10 h-10"></div>
        </header>

        <!-- 主内容 -->
        <main class="flex-1 flex flex-col overflow-hidden max-w-md mx-auto w-full">
            <div class="px-5 py-5 flex flex-col items-end border-b border-border-blush bg-surface-white shrink-0">
                <div class="flex items-center gap-2 w-full">
                    <span id="category-icon-display" class="text-2xl"></span>
                    <span id="category-name-display" class="text-[13px] text-text-muted"></span>
                </div>
                <div class="flex items-baseline w-full justify-end mt-2 overflow-hidden">
                    <span class="text-[18px] text-on-surface mr-1">¥</span>
                    <span id="amount-display" class="text-[32px] text-on-surface font-bold truncate font-display">0.00</span>
                </div>
                <div class="w-full mt-3 flex items-center gap-2 border-t border-border-blush pt-3">
                    <span class="material-symbols-outlined text-text-muted text-[16px]">edit_note</span>
                    <input id="note-input" type="text" placeholder="添加备注..." class="flex-1 bg-transparent border-none text-[13px] text-text-muted placeholder:text-text-disabled p-0 h-6 outline-none" />
                </div>
            </div>

            <div id="category-grid" class="flex-1 overflow-y-auto bg-bg-soft-pink px-5 py-4"></div>

            <div class="bg-surface-white border-t border-border-blush pb-safe shrink-0">
                <div class="flex items-center justify-between px-4 py-2 border-b border-border-blush/50">
                    <button id="date-btn" class="flex items-center gap-1 text-[13px] text-text-muted bg-surface-container-low px-3 py-1 rounded-full">
                        <span class="material-symbols-outlined text-[16px]">calendar_today</span>
                        <span id="date-label">今天</span>
                    </button>
                </div>
                <div class="grid grid-cols-4 grid-rows-4 h-64">
                    <button class="keypad-btn text-[18px] text-on-surface border-r border-b border-border-blush/30" data-num="1">1</button>
                    <button class="keypad-btn text-[18px] text-on-surface border-r border-b border-border-blush/30" data-num="2">2</button>
                    <button class="keypad-btn text-[18px] text-on-surface border-r border-b border-border-blush/30" data-num="3">3</button>
                    <button id="btn-backspace" class="keypad-btn flex items-center justify-center text-text-muted border-b border-border-blush/30">
                        <span class="material-symbols-outlined">backspace</span>
                    </button>
                    <button class="keypad-btn text-[18px] text-on-surface border-r border-b border-border-blush/30" data-num="4">4</button>
                    <button class="keypad-btn text-[18px] text-on-surface border-r border-b border-border-blush/30" data-num="5">5</button>
                    <button class="keypad-btn text-[18px] text-on-surface border-r border-b border-border-blush/30" data-num="6">6</button>
                    <button id="btn-clear" class="keypad-btn text-[16px] text-text-muted border-b border-border-blush/30">C</button>
                    <button class="keypad-btn text-[18px] text-on-surface border-r border-b border-border-blush/30" data-num="7">7</button>
                    <button class="keypad-btn text-[18px] text-on-surface border-r border-b border-border-blush/30" data-num="8">8</button>
                    <button class="keypad-btn text-[18px] text-on-surface border-r border-b border-border-blush/30" data-num="9">9</button>
                    <button id="btn-save" class="bg-primary text-on-primary font-bold text-[16px] row-span-2 shadow-[0_4px_12px_rgba(255,107,157,0.2)] active:opacity-90 transition-opacity">保存</button>
                    <button class="keypad-btn text-[18px] text-on-surface border-r border-border-blush/30 col-span-2" data-num="0">0</button>
                    <button class="keypad-btn text-[18px] text-on-surface border-r border-border-blush/30" data-num=".">.</button>
                </div>
            </div>
        </main>
    </div>

    <script src="../shared/js/auth.js"></script>
    <script src="../shared/js/utils.js"></script>
    <script src="../shared/js/data.js"></script>

    <script>
        /* 路由守卫：未登录则跳转 login.html */
        if (!Auth.requireAuth()) {} else { init(); }

        function init() {
            /* ========== 状态 ========== */
            let isExpense = true;
            let selectedCategory = null;
            let inputString = '';
            let recordDate = Utils.today();

            const amountDisplay = document.getElementById('amount-display');
            const iconDisplay  = document.getElementById('category-icon-display');
            const nameDisplay  = document.getElementById('category-name-display');
            const dateLabel    = document.getElementById('date-label');

            /* ========== 渲染分类网格 ========== */
            const renderCategories = () => {
                const list = isExpense ? MockData.expenseCategories : MockData.incomeCategories;
                const grid = document.getElementById('category-grid');
                // 用 DocumentFragment 批量插入，减少重排
                const wrap = document.createElement('div');
                wrap.className = 'grid grid-cols-4 gap-y-5 gap-x-2';
                list.slice(0, 8).forEach((c) => {
                    const btn = document.createElement('button');
                    btn.dataset.cat = c.id;
                    btn.className = 'cat-btn flex flex-col items-center gap-2 group';
                    btn.innerHTML = `
                        <div class="w-12 h-12 rounded-full flex items-center justify-center text-2xl border-2 border-transparent transition-transform active:scale-95"
                             style="background-color: ${c.color}20">${c.emoji}</div>
                        <span class="text-[11px] text-text-muted">${c.name}</span>`;
                    btn.addEventListener('click', () => selectCategory(btn.dataset.cat));
                    wrap.appendChild(btn);
                });
                grid.replaceChildren(wrap);
            };

            const selectCategory = (id) => {
                const cat = MockData.getCategoryById(id);
                if (!cat) return;
                selectedCategory = cat;
                iconDisplay.textContent = cat.emoji;
                nameDisplay.textContent = cat.name;
                document.querySelectorAll('.cat-btn > div').forEach((el) => {
                    el.classList.remove('border-2');
                    el.style.borderColor = 'transparent';
                });
                const active = document.querySelector(`[data-cat="${id}"] > div`);
                if (active) {
                    active.classList.add('border-2');
                    active.style.borderColor = cat.color;
                }
            };

            /* ========== 支出/收入切换 ========== */
            const highlighter = document.getElementById('segment-highlighter');
            const btnExpense = document.getElementById('btn-expense');
            const btnIncome  = document.getElementById('btn-income');

            const switchType = (toExpense) => {
                if (toExpense === isExpense) return;
                isExpense = toExpense;
                highlighter.style.transform = toExpense ? 'translateX(0)' : 'translateX(100%)';
                if (toExpense) {
                    btnExpense.classList.add('text-expense-red', 'font-bold');
                    btnExpense.classList.remove('text-text-muted');
                    btnIncome.classList.remove('text-income-teal', 'font-bold');
                    btnIncome.classList.add('text-text-muted');
                } else {
                    btnIncome.classList.add('text-income-teal', 'font-bold');
                    btnIncome.classList.remove('text-text-muted');
                    btnExpense.classList.remove('text-expense-red', 'font-bold');
                    btnExpense.classList.add('text-text-muted');
                }
                selectedCategory = null;
                iconDisplay.textContent = '';
                nameDisplay.textContent = '';
                renderCategories();
            };
            btnExpense.addEventListener('click', () => switchType(true));
            btnIncome.addEventListener('click',  () => switchType(false));

            /* ========== 数字键盘 ========== */
            const updateDisplay = () => { amountDisplay.textContent = inputString || '0.00'; };
            const appendNumber = (n) => {
                if (inputString === '0' && n !== '.') inputString = n;
                else if (n === '.' && inputString.includes('.')) return;
                else if (inputString.includes('.') && inputString.split('.')[1].length >= 2) return;
                else inputString += n;
                updateDisplay();
            };
            document.querySelectorAll('[data-num]').forEach((btn) => {
                btn.addEventListener('click', () => appendNumber(btn.dataset.num));
            });
            document.getElementById('btn-backspace').addEventListener('click', () => {
                inputString = inputString.slice(0, -1);
                updateDisplay();
            });
            document.getElementById('btn-clear').addEventListener('click', () => {
                inputString = '';
                updateDisplay();
            });

            /* ========== 日期切换 ========== */
            document.getElementById('date-btn').addEventListener('click', () => {
                const days = ['今天', '昨天', '前天'];
                const cur  = dateLabel.textContent;
                const idx  = days.indexOf(cur);
                const next = days[(idx + 1) % days.length];
                dateLabel.textContent = next;
                const d = new Date();
                d.setDate(d.getDate() - idx);
                recordDate = d.toISOString().slice(0, 10);
            });

            /* ========== 保存 ========== */
            document.getElementById('btn-save').addEventListener('click', () => {
                if (!selectedCategory) { alert('请选择一个分类'); return; }
                if (!inputString || parseFloat(inputString) === 0) { alert('请输入金额'); return; }
                const note = document.getElementById('note-input').value.trim();
                const record = {
                    id: 't_' + Date.now(),
                    type: isExpense ? 'expense' : 'income',
                    amount: parseFloat(inputString),
                    categoryId: selectedCategory.id,
                    date: recordDate,
                    note,
                    createdAt: Date.now(),
                };
                MockData.transactions.unshift(record);
                alert('保存成功 ✨');
                window.location.href = 'home.html';
            });

            /* ========== 首次渲染 + 显示内容 ========== */
            renderCategories();

            // 用 rAF 推迟到下一帧再显示，避免阻塞主线程导致首屏白屏
            requestAnimationFrame(() => {
                document.getElementById('app-content').classList.add('ready');
                const loader = document.getElementById('app-loader');
                loader.classList.add('fade-out');
                setTimeout(() => loader.remove(), 300);
            });
        }
    </script>
</body>
</html>
