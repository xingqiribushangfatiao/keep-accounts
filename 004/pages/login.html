<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>登录 · Petal Ledger</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="../shared/css/tokens.css" />
    <link rel="stylesheet" href="../shared/css/base.css" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        surface: 'var(--surface)',
                        'bg-soft-pink': 'var(--bg-soft-pink)',
                        'surface-white': 'var(--surface-white)',
                        primary: 'var(--primary)',
                        'on-primary': 'var(--on-primary)',
                        'on-surface': 'var(--on-surface)',
                        'on-surface-variant': 'var(--on-surface-variant)',
                        'text-muted': 'var(--text-muted)',
                        'text-disabled': 'var(--text-disabled)',
                        'border-blush': 'var(--border-blush)',
                        'expense-red': 'var(--expense-red)',
                    },
                    borderRadius: {
                        full: 'var(--radius-full)',
                        xl: 'var(--radius-xl)',
                        '2xl': 'var(--radius-2xl)',
                    },
                    fontFamily: {
                        body: ['Be Vietnam Pro', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    backgroundImage: {
                        'primary-gradient': 'linear-gradient(135deg, #FF6B9D 0%, #FFB1C5 100%)',
                    },
                },
            },
        };
    </script>
</head>
<body class="bg-bg-soft-pink min-h-screen flex flex-col font-body text-on-surface antialiased overflow-x-hidden relative">

    <!-- 装饰性背景模糊圆 -->
    <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full pointer-events-none" style="background: radial-gradient(circle, rgba(255,107,157,0.15) 0%, transparent 70%);"></div>
    <div class="absolute -bottom-40 -right-20 w-96 h-96 rounded-full pointer-events-none" style="background: radial-gradient(circle, rgba(255,182,193,0.2) 0%, transparent 70%);"></div>

    <!-- 主内容 -->
    <main class="flex-1 flex flex-col justify-center px-6 py-10 max-w-md mx-auto w-full relative z-10">
        <!-- Logo 区域 -->
        <div class="text-center mb-10 flex flex-col items-center gap-3">
            <div class="w-20 h-20 rounded-full bg-surface-white flex items-center justify-center text-4xl shadow-[0_4px_16px_rgba(255,107,157,0.15)]">
                💖
            </div>
            <h1 class="font-display text-[28px] font-bold tracking-tight">随手记账</h1>
            <p class="text-text-muted text-[13px]">登录开始记账之旅</p>
        </div>

        <!-- 登录表单 -->
        <form id="login-form" class="space-y-5" novalidate>
            <div>
                <label for="username" class="block text-[13px] font-semibold text-on-surface mb-2 ml-1">用户名</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-muted text-[20px]">person</span>
                    <input id="username" name="username" type="text" placeholder="zhangsan"
                           class="input-field" required />
                </div>
            </div>

            <div>
                <label for="password" class="block text-[13px] font-semibold text-on-surface mb-2 ml-1">密码</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-muted text-[20px]">lock</span>
                    <input id="password" name="password" type="password" placeholder="••••••"
                           class="input-field pl-12 pr-12" required />
                    <button type="button" aria-label="切换密码显隐" data-password-toggle="password"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-text-muted hover:text-primary transition-colors">
                        <span class="material-symbols-outlined text-[20px]">visibility</span>
                    </button>
                </div>
            </div>

            <!-- 记住我 + 忘记密码 -->
            <div class="flex items-center justify-between pt-1">
                <label class="flex items-center gap-2 cursor-pointer text-[13px] text-on-surface">
                    <input type="checkbox" id="remember" name="remember" class="w-4 h-4 rounded border-border-blush text-primary focus:ring-primary" />
                    记住我 <span class="text-text-muted text-[12px]">（7天免登录）</span>
                </label>
                <a href="#" class="text-[13px] text-text-muted hover:text-primary transition-colors">忘记密码?</a>
            </div>

            <!-- 错误提示 -->
            <p id="error-msg" class="hidden text-error text-[13px] text-center pt-1"></p>

            <!-- 登录按钮 -->
            <button type="submit"
                    class="w-full py-3.5 rounded-full text-on-primary font-semibold text-[15px] tracking-wide bg-primary-gradient shadow-[0_6px_18px_rgba(255,107,157,0.35)] hover:shadow-[0_8px_22px_rgba(255,107,157,0.5)] active:scale-[0.98] transition-all">
                登 录
            </button>
        </form>

        <!-- 注册跳转 -->
        <div class="text-center mt-6 text-[13px] text-text-muted">
            还没有账号？
            <a href="register.html" class="text-primary font-semibold hover:underline">立即注册</a>
        </div>
    </main>

    <script src="../shared/js/auth.js"></script>
    <script>
        // 密码显隐切换
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-password-toggle]');
            if (!btn) return;
            const input = document.getElementById(btn.dataset.passwordToggle);
            const icon = btn.querySelector('.material-symbols-outlined');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        });

        // 登录提交
        const form = document.getElementById('login-form');
        const errEl = document.getElementById('error-msg');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = form.username.value.trim();
            const password = form.password.value;
            const remember = form.remember.checked;

            // 修复：把 password 传给 Auth.login
            const result = Auth.login(username, password, remember);
            if (result.ok) {
                window.location.href = 'home.html';
            } else {
                errEl.textContent = result.message;
                errEl.classList.remove('hidden');
            }
        });

        // 已登录直接进首页（带一个"切换账号"入口，方便测试）
        if (Auth.isLoggedIn()) {
            const main = document.querySelector('main');
            if (main && !document.getElementById('switch-account-bar')) {
                const bar = document.createElement('div');
                bar.id = 'switch-account-bar';
                bar.className = 'text-center text-[12px] text-text-muted mt-4';
                bar.innerHTML = `已登录为 <span class="text-primary font-semibold">${Auth.getSession().username}</span> · <a href="#" id="switch-account" class="text-primary hover:underline">切换账号</a>`;
                main.appendChild(bar);
                document.getElementById('switch-account').addEventListener('click', (ev) => {
                    ev.preventDefault();
                    if (confirm('确定要退出当前账号吗？')) {
                        Auth.logout();
                        window.location.reload();
                    }
                });
            }
        }
    </script>
</body>
</html>
